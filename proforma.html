<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proforma | Vascruz Import & Export SRL</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/logo-sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--fg:#141414;--muted:#5f5d58;--surface:#f8f5ee;--line:#e6dfcd;--gold:#a8822a;--gold-btn:#d2ad55;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
html{color-scheme:light}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#efebe2;color:var(--fg);font:15px/1.5 var(--body)}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:5px;font:700 14px var(--body);border:1px solid #cfc8b8;background:#fff;color:#111;text-decoration:none;cursor:pointer}
.btn-gold{background:var(--gold-btn);border-color:var(--gold-btn)}
.hoja{max-width:820px;margin:0 auto 40px;background:#fff;padding:36px 40px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--gold);padding-bottom:16px}
.top img{height:64px}
.top .emp{text-align:right;font-size:12px;color:var(--muted);line-height:1.5}
.top .emp b{color:var(--fg);font-size:13px}
.tit{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:22px 0 14px;flex-wrap:wrap}
h1{font:700 24px var(--display);margin:0;letter-spacing:.02em}
.num{font:500 13px var(--mono);color:var(--gold)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.meta div{padding:4px 0}.meta span{color:var(--muted);display:inline-block;min-width:92px}
.veh{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;margin-top:20px;align-items:start}
.veh img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;background:var(--surface)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
h2{font:700 20px var(--display);margin:4px 0 2px}
.datos{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.datos td{padding:5px 0;border-bottom:1px dotted var(--line)}.datos td:last-child{text-align:right;font-weight:600}
.precio{margin-top:22px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.precio .tot{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--surface)}
.precio .tot b{font:700 26px var(--display)}
.plan{width:100%;border-collapse:collapse;font-size:13.5px}
.plan th,.plan td{padding:9px 18px;border-top:1px solid var(--line);text-align:left}
.plan th{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plan td:last-child,.plan th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.nota{margin-top:16px;font-size:13px;padding:10px 14px;border-left:3px solid var(--gold);background:var(--surface)}
.cond{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.55}
.firma{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:12.5px;flex-wrap:wrap}
.firma b{display:block;font-size:13.5px}
.err{max-width:520px;margin:60px auto;text-align:center;background:#fff;padding:30px;border-radius:8px}
@media (max-width:640px){.hoja{padding:22px 18px}.veh,.meta{grid-template-columns:1fr}.top img{height:48px}}
@page{size:A4;margin:12mm}
@media print{body{background:#fff}.bar{display:none}.hoja{box-shadow:none;margin:0;padding:0;max-width:none}
  .veh{grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}.meta{grid-template-columns:1fr 1fr;padding:8px 12px;font-size:12px}.meta div{padding:2px 0}
  body{font-size:12.5px}.top img{height:52px}.top{padding-bottom:10px}.tit{margin:12px 0 8px}h1{font-size:20px}h2{font-size:17px}
  .datos{font-size:11.5px}.datos td{padding:3px 0}.precio{margin-top:12px}.precio .tot{padding:9px 14px}.precio .tot b{font-size:21px}
  .plan th,.plan td{padding:6px 14px;font-size:12px}.nota{margin-top:10px;padding:7px 12px}.cond{margin-top:10px;font-size:10.5px}.firma{margin-top:14px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <button class="btn btn-gold" onclick="window.print()">Descargar PDF / Imprimir</button>
  <a class="btn" id="wa" target="_blank" rel="noopener">Consultar al asesor por WhatsApp</a>
  <a class="btn" href="index.html">Ver catálogo</a>
</div>
<div id="out"><p style="text-align:center;padding:60px;color:#5f5d58">Cargando proforma…</p></div>

<script type="module">
import { db, doc, getDoc, usd, esc, nombreAuto } from "./fb.js?v=1";
const id = new URLSearchParams(location.search).get("id");
const out = document.getElementById("out");
const fail = (t) => out.innerHTML = `<div class="err"><img src="img/logo-sm.png" alt="" style="height:56px"><p>${t}</p><a class="btn btn-gold" href="https://wa.me/59177006107">Escribir a Vascruz</a></div>`;
try {
  if (!id) throw 0;
  const s = await getDoc(doc(db, "proformas", id));
  if (!s.exists()) throw 0;
  const p = s.data(), v = p.vehiculo || {}, f = v.ficha || {};
  const fch = p.fecha && p.fecha.toDate ? p.fecha.toDate() : new Date();
  const vence = new Date(fch.getTime() + (p.validez_dias || 15) * 864e5);
  const fmt = (d) => d.toLocaleDateString("es-BO", { day: "2-digit", month: "long", year: "numeric" });
  const tec = v.tec === "BEV" ? "100% eléctrico" : v.tec === "PHEV" ? "Híbrido enchufable" : v.tec;
  const filas = [["Tecnología", tec], ["Carrocería", v.tipo], ["Autonomía", v.autonomia ? v.autonomia + " km" : (f.carga || "")], ["Batería", f.bateria], ["Potencia", f.potencia],
    ["Tracción", f.traccion], ["Dimensiones (L × A × H)", f.dimensiones], ["Color", p.color]].filter(r => r[1]);
  const pg = p.pagos || [];
  document.title = `Proforma ${p.numero} — ${nombreAuto(v)} | Vascruz`;
  const telAs = String(p.asesor_tel || "").replace(/[^\d]/g, "") || "59177006107";
  document.getElementById("wa").href = `https://wa.me/${telAs}?text=${encodeURIComponent("Hola, tengo una consulta sobre la proforma " + p.numero + " (" + nombreAuto(v) + ").")}`;
  document.getElementById("bar").hidden = false;
  out.innerHTML = `<div class="hoja">
    <div class="top"><img src="img/logo-sm.png" alt="Vascruz Import &amp; Export SRL">
      <div class="emp"><b>Vascruz Import &amp; Export SRL</b><br>Av. Grigotá B/El Parí, Calle Guariyú #132<br>entre 2do y 3er anillo, Santa Cruz de la Sierra, Bolivia<br>WhatsApp +591 77006107 · grupovascruzllc@gmail.com · vascruz.com</div></div>
    <div class="tit"><h1>PROFORMA</h1><div class="num">N.° ${esc(p.numero)}</div></div>
    <div class="meta">
      <div><span>Cliente:</span> <b>${esc(p.cliente_nombre)}</b></div><div><span>Fecha:</span> ${fmt(fch)}</div>
      ${p.cliente_doc ? `<div><span>CI / NIT:</span> ${esc(p.cliente_doc)}</div>` : ""}${p.cliente_tel ? `<div><span>Celular:</span> ${esc(p.cliente_tel)}</div>` : ""}
      <div><span>Asesor:</span> ${esc(p.asesor_nombre)}</div><div><span>Válida hasta:</span> ${fmt(vence)}</div>
    </div>
    <div class="veh">
      <div>${v.foto ? `<img src="${esc(v.foto)}" alt="">` : ""}</div>
      <div><div class="eyebrow">${esc(v.marca)} · ${esc(v.anio)}</div><h2>${esc(v.modelo)}</h2><div style="color:var(--muted)">${esc(v.version)}</div>
        <table class="datos">${filas.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div>
    </div>
    <div class="precio">
      <div class="tot"><span>Precio puesto en Santa Cruz de la Sierra</span><b>${usd(p.precio)}</b></div>
      <table class="plan"><tr><th>Plan de pagos</th><th>Momento</th><th>Monto</th></tr>
        <tr><td>1.er pago — Reserva (50%)</td><td>Al confirmar la compra</td><td>${usd(pg[0])}</td></tr>
        <tr><td>2.º pago — Chasis (30%)</td><td>Con el número de chasis asignado</td><td>${usd(pg[1])}</td></tr>
        <tr><td>3.er pago — Iquique (20%)</td><td>Con el vehículo en Iquique, Chile</td><td>${usd(pg[2])}</td></tr></table>
    </div>
    ${p.nota ? `<div class="nota">${esc(p.nota)}</div>` : ""}
    <div class="cond"><b>Condiciones:</b> Precio en dólares americanos (USD), con el vehículo nuevo importado de fábrica y entregado en Santa Cruz de la Sierra. Vehículos eléctricos e híbridos enchufables nuevos con 0% de gravamen arancelario e ICE según normativa vigente. Sujeto a disponibilidad de stock, versión y color al momento de la reserva. Esta proforma no constituye factura ni contrato.</div>
    <div class="firma"><div><b>${esc(p.asesor_nombre)}</b>Asesor de importación${p.asesor_tel ? " · " + esc(p.asesor_tel) : ""}</div><div style="text-align:right"><b>Vascruz Import &amp; Export SRL</b>Santa Cruz de la Sierra, Bolivia</div></div>
  </div>`;
} catch (e) { fail("No encontramos esta proforma. Verifique el enlace o consulte a su asesor."); }
</script>
</body>
</html>
