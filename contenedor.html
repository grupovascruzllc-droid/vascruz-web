<!doctype html>
<html lang="es" class="solo-claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cotización por contenedor | Vascruz Import & Export SRL</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/logo-sm.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--fg:#141414;--muted:#5f5d58;--surface:#f8f5ee;--line:#e6dfcd;--gold:#a8822a;--gold-btn:#d2ad55;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;--body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
html{color-scheme:light}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:#efebe2;color:var(--fg);font:15px/1.5 var(--body)}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:14px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:5px;font:700 14px var(--body);border:1px solid #cfc8b8;background:#fff;color:#111;text-decoration:none;cursor:pointer}
.btn-gold{background:var(--gold-btn);border-color:var(--gold-btn)}
.latir{animation:latir 1.2s ease-in-out 4}@keyframes latir{50%{transform:scale(1.08)}}
.hoja{max-width:860px;margin:0 auto 40px;background:#fff;padding:36px 40px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--gold);padding-bottom:16px}
.top img{height:60px}
.top .emp{text-align:right;font-size:12px;color:var(--muted);line-height:1.5}
.top .emp b{color:var(--fg);font-size:13px}
.tit{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:22px 0 14px;flex-wrap:wrap}
h1{font:700 21px var(--display);margin:0;letter-spacing:.02em}
.num{font:500 13px var(--mono);color:var(--gold)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;font-size:13.5px;border:1px solid var(--line);border-radius:6px;padding:12px 16px}
.meta div{padding:4px 0}.meta span{color:var(--muted);display:inline-block;min-width:92px}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.autos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.auto{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.auto img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--surface)}
.auto .tx{padding:10px 12px;font-size:13px}.auto b{display:block;font-size:14px;line-height:1.3}
.auto .pr{display:flex;justify-content:space-between;margin-top:6px;font-weight:700}
h3{font:700 15px var(--display);margin:22px 0 8px}
.det{width:100%;border-collapse:collapse;font-size:13px}
.det th{background:#141414;color:#fff;font:600 11px/1.3 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;text-align:right}
.det th:first-child{text-align:left}
.det td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.det td:first-child{text-align:left;white-space:normal}
.det tr.sub td{background:var(--surface);font-weight:700}
.det tr.gran td{background:#141414;color:#fff;font-weight:700;font-size:14px}
.tbl{overflow-x:auto}
.total{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:6px;margin-top:18px;gap:12px;flex-wrap:wrap}
.total b{font:700 26px var(--display)}
.plan{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
.plan th,.plan td{padding:8px 14px;border-top:1px solid var(--line);text-align:left}
.plan th{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plan td:last-child,.plan th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.nota{margin-top:16px;font-size:13px;padding:10px 14px;border-left:3px solid var(--gold);background:var(--surface)}
.cond{margin-top:18px;font-size:11.5px;color:var(--muted);line-height:1.55}
.firma{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:12.5px;flex-wrap:wrap}
.firma b{display:block;font-size:13.5px}
.err{max-width:520px;margin:60px auto;text-align:center;background:#fff;padding:30px;border-radius:8px}
@media (max-width:640px){.hoja{padding:22px 16px}.meta{grid-template-columns:1fr}.top img{height:46px}.det{font-size:12px}.det td,.det th{padding:6px}}
@page{size:A4;margin:12mm}
.compacto{font-size:11px;padding:0!important;box-shadow:none!important;max-width:none!important;margin:0!important}
.compacto .top img{height:40px}.compacto .top{padding-bottom:6px}.compacto .emp{font-size:9.5px;line-height:1.35}
.compacto .tit{margin:8px 0 6px}.compacto h1{font-size:15px}.compacto .meta{font-size:10.5px;padding:5px 10px}.compacto .meta div{padding:1px 0}
.compacto .autos{grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.compacto .auto .tx{padding:5px 7px;font-size:10px}.compacto .auto b{font-size:10.5px}
.compacto h3{font-size:11.5px;margin:10px 0 4px}.compacto .det{font-size:10px}.compacto .det td,.compacto .det th{padding:3px 6px}.compacto .det th{font-size:8.5px}
.compacto .total{padding:7px 12px;margin-top:8px}.compacto .total b{font-size:18px}.compacto .plan th,.compacto .plan td{padding:4px 10px;font-size:10.5px}
.compacto .nota{margin-top:6px;padding:4px 10px;font-size:10px}.compacto .cond{font-size:9.5px;margin-top:6px;line-height:1.4}.compacto .firma{margin-top:8px;font-size:10.5px}
@media print{body{background:#fff}.bar{display:none}.hoja{zoom:var(--zoom,1)}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
<link rel="stylesheet" href="tema.css?v=1">
<script src="tema.js?v=1"></script>
</head>
<body>
<div class="bar" id="bar" hidden>
  <button class="btn btn-gold" id="btn-pdf" type="button">⬇ Descargar PDF</button>
  <button class="btn" type="button" id="btn-imprimir">Imprimir</button>
  <a class="btn" id="wa" target="_blank" rel="noopener">Consultar al asesor por WhatsApp</a>
  <a class="btn" href="index.html">Ver catálogo</a>
</div>
<div id="out"><p style="text-align:center;padding:60px;color:#5f5d58">Cargando cotización…</p></div>

<script type="module">
import { leerPublico, usd, esc, telWa, listoParaImprimir } from "./publico.js?v=1";
import { descargarPDF, abrirPDF, esIOS, esSafari } from "./pdf.js?v=2";

// Al imprimir: la hoja se mide con el estilo compacto y se reduce lo justo para que entre en una sola hoja A4.
function ajustarUnaHoja() {
  const h = document.querySelector(".hoja"); if (!h) return;
  h.style.removeProperty("--zoom");
  const ancho = h.style.width; h.classList.add("compacto"); h.style.width = "186mm";
  const alto = h.scrollHeight; h.style.width = ancho; h.classList.remove("compacto");
  const maximo = (297 - 24) * 96 / 25.4 - 40;
  if (alto > maximo) h.style.setProperty("--zoom", (maximo / alto).toFixed(3));
}
addEventListener("beforeprint", () => { document.querySelector(".hoja")?.classList.add("compacto"); ajustarUnaHoja(); document.querySelector(".hoja")?.classList.add("compacto"); });
addEventListener("afterprint", () => document.querySelector(".hoja")?.classList.remove("compacto"));

const params = new URLSearchParams(location.search);
const id = params.get("id");
const out = document.getElementById("out");
const fail = (t) => out.innerHTML = `<div class="err"><img src="img/logo-sm.png" alt="" style="height:56px"><p>${t}</p><a class="btn btn-gold" href="https://wa.me/59177006107">Escribir a Vascruz</a></div>`;
const tecTxt = (t) => t === "BEV" ? "100% eléctrico" : t === "PHEV" ? "Híbrido enchufable" : t || "";
try {
  if (!id) throw 0;
  const p = await leerPublico("proformas", id);
  if (!p || p.tipo !== "contenedor" || !Array.isArray(p.lineas)) throw 0;
  const L = p.lineas, U = p.unidades || L.reduce((a, l) => a + (l.cant || 0), 0);
  const fch = p.fecha && p.fecha.toDate ? p.fecha.toDate() : new Date();
  const fmt = (d) => d.toLocaleDateString("es-BO", { day: "2-digit", month: "long", year: "numeric" });
  const vence = new Date(fch.getTime() + (p.validez_dias || 7) * 864e5);
  const pg = p.pagos || [];
  document.title = `Cotización ${p.numero} — Contenedor de ${U} vehículos | Vascruz`;
  const telAs = telWa(p.asesor_tel) || "59177006107";
  document.getElementById("wa").href = `https://wa.me/${telAs}?text=${encodeURIComponent("Hola, tengo una consulta sobre la cotización por contenedor " + p.numero + ".")}`;
  document.getElementById("bar").hidden = false;

  // Desglose: una columna por vehículo (montos por unidad)
  const hay = (k) => L.some(l => Number(l[k]) > 0);
  const filas = [
    ["Compra del vehículo en China (FOB)", "fob"],
    ["Flete marítimo (parte del contenedor)", "flete"],
    ["Gasto logístico en puerto Iquique", "logistica"],
    ["Seguro internacional", "seguro"],
    ["Transporte terrestre Iquique → Santa Cruz", "cig"],
    ...(hay("otros") ? [["Otros gastos de importación", "otros"]] : []),
    [null, "tributos"],
    ["Gestión y servicio de importación", "gestion"],
    ...(hay("descuento") ? [["Descuento", "descuento"]] : []),
  ];
  const tribTxt = (l) => l.ga_pct ? `Tributos aduaneros (arancel ${Math.round(l.ga_pct * 100)}% + IVA 14,94%)` : "Tributos aduaneros (IVA 14,94%, sin arancel ni ICE)";
  const tribIgual = L.every(l => tribTxt(l) === tribTxt(L[0]));
  const desglose = `<h3>Desglose por vehículo (USD por unidad)</h3>
    <div class="tbl"><table class="det"><thead><tr><th>Concepto</th>${L.map(l => `<th>${esc(l.nombre)}</th>`).join("")}</tr></thead><tbody>
      ${filas.map(([t, k]) => `<tr><td>${t || (tribIgual ? tribTxt(L[0]) : "Tributos aduaneros (arancel e IVA)")}</td>${L.map(l => `<td>${k === "descuento" && l[k] ? "-" : ""}${usd(l[k] || 0)}</td>`).join("")}</tr>`).join("")}
      <tr class="sub"><td>Precio por vehículo puesto en Santa Cruz</td>${L.map(l => `<td>${usd(l.precio)}</td>`).join("")}</tr>
      <tr><td>Cantidad</td>${L.map(l => `<td>${l.cant}</td>`).join("")}</tr>
      <tr class="gran"><td>Total</td>${L.map(l => `<td>${usd(l.total)}</td>`).join("")}</tr>
    </tbody></table></div>
    <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0">El flete marítimo y la logística de puerto del contenedor se dividen entre los ${U} vehículos. Base imponible CIF = FOB + 10% del transporte + seguro.</p>`;

  out.innerHTML = `<div class="hoja">
    <div class="top"><img src="img/logo-sm.png" alt="Vascruz Import &amp; Export SRL">
      <div class="emp"><b>Vascruz Import &amp; Export SRL</b><br>Av. Grigotá B/El Parí, Calle Guariyú #132, entre 2do y 3er anillo · Santa Cruz de la Sierra<br>Cel./WhatsApp: +591 77006107 · grupovascruzllc@gmail.com · vascruz.com</div></div>
    <div class="tit"><h1>COTIZACIÓN POR CONTENEDOR · ${U} ${U === 1 ? "VEHÍCULO" : "VEHÍCULOS"}</h1><div class="num">N.° ${esc(p.numero)}</div></div>
    <div class="meta">
      <div><span>Cliente:</span> <b>${esc(p.cliente_nombre)}</b></div><div><span>Fecha:</span> ${fmt(fch)}</div>
      ${p.cliente_doc ? `<div><span>CI / NIT:</span> ${esc(p.cliente_doc)}</div>` : ""}${p.cliente_tel ? `<div><span>Celular:</span> ${esc(p.cliente_tel)}</div>` : ""}
      <div><span>Asesor:</span> ${esc(p.asesor_nombre)}</div><div><span>Válida hasta:</span> ${fmt(vence)}</div>
    </div>
    <div class="autos">${L.map(l => `<div class="auto">${l.foto ? `<img src="${esc(l.foto)}" alt="" crossorigin="anonymous">` : ""}
      <div class="tx"><span class="eyebrow">${esc(tecTxt(l.tec))}${l.tipo ? " · " + esc(l.tipo) : ""}</span><b>${esc(l.nombre)}</b>
        <div class="pr"><span>${l.cant} × ${usd(l.precio)}</span><span>${usd(l.total)}</span></div></div></div>`).join("")}</div>
    ${p.mostrar_desglose ? desglose : ""}
    <div class="total"><span>Total del contenedor puesto en Santa Cruz de la Sierra</span><b>${usd(p.precio)}</b></div>
    <table class="plan"><tr><th>Plan de pagos</th><th>Momento</th><th>Monto</th></tr>
      <tr><td>1.er pago — Reserva (50%)</td><td>Al confirmar la compra</td><td>${usd(pg[0])}</td></tr>
      <tr><td>2.º pago — Chasis (30%)</td><td>Con los números de chasis asignados</td><td>${usd(pg[1])}</td></tr>
      <tr><td>3.er pago — Iquique (20%)</td><td>Con los vehículos en Iquique, Chile</td><td>${usd(pg[2])}</td></tr></table>
    ${p.nota ? `<div class="nota">${esc(p.nota)}</div>` : ""}
    <div class="cond">• Cotización referencial en dólares americanos, sujeta a variación de flete, gastos portuarios y tributos al momento de la nacionalización.<br>
      • Precio por vehículo puesto en Santa Cruz de la Sierra, importando los ${U} vehículos juntos en un mismo contenedor. Si cambia la cantidad, cambia el precio.<br>
      • Sujeto a disponibilidad de stock, versión y color al momento de la reserva. No constituye factura ni contrato. Validez: ${p.validez_dias || 7} días calendario.</div>
    <div class="firma"><div><b>${esc(p.asesor_nombre)}</b>Asesor de Vascruz${p.asesor_tel ? " · " + esc(p.asesor_tel) : ""}</div><div style="text-align:right"><b>José María Vásquez Aguado</b>Gerente General — Vascruz Import &amp; Export SRL</div></div>
  </div>`;

  const btn = document.getElementById("btn-pdf");
  const nombreArchivo = "Cotizacion contenedor " + p.numero + ".pdf";
  const hoja = () => out.querySelector(".hoja");
  btn.onclick = async () => {
    const t = btn.textContent; btn.disabled = true; btn.textContent = "Preparando PDF…";
    try { await descargarPDF(hoja(), nombreArchivo, "compacto"); }
    catch (err) { alert("No se pudo crear el PDF. Pruebe con el botón Imprimir.\n" + (err && err.message || err)); }
    finally { btn.disabled = false; btn.textContent = t; }
  };
  document.getElementById("btn-imprimir").onclick = async () => {
    if (!esSafari) return window.print();
    try { await abrirPDF(hoja(), "compacto"); } catch (err) { window.print(); }
  };
  const SIN_AUTO = esIOS || esSafari;
  if (params.get("imprimir") === "1" && SIN_AUTO) { btn.classList.add("latir"); scrollTo(0, 0); }
  if (params.get("imprimir") === "1" && !SIN_AUTO) { await listoParaImprimir(out); setTimeout(() => window.print(), 100); }
} catch (e) { fail("No encontramos esta cotización. Verifique el enlace o consulte a su asesor."); }
</script>
</body>
</html>
